name: Feature request
description: Suggest an improvement to the diff rendering experience
labels: ["type: enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the reviewing/diff workflow pain this would address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should the plugin do? Which BEH-n in docs/spec/behaviour-spec.md does it extend or add?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
