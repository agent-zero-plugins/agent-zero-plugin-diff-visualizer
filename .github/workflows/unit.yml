name: unit
# Python unit suite (publisher hook + existing plugin tests).
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # The testkit submodule is PRIVATE: the default GITHUB_TOKEN cannot clone
      # it (observed: 'Repository not found' → 10s failure). Mint an App token
      # from the shared sync App (same secrets devkit-sync.yml uses).
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.SKILLS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SKILLS_SYNC_APP_PRIVATE_KEY }}
          owner: agent-zero-plugins
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Link testkit (creates tests/_testkit symlink)
        run: make link-testkit || true
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest pytest-asyncio pyyaml
      - name: Run unit suite
        run: python -m pytest tests -q
