name: unit
# Python unit suite (publisher hook + existing plugin tests).
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Link testkit (creates tests/_testkit symlink)
        run: make link-testkit || true
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest pytest-asyncio pyyaml
      - name: Run unit suite
        run: python -m pytest tests -q
