<html>
<head><title>Diff Renderer</title></head>
<body>
<div style="display:none;"></div>

<script>
// diff2html is loaded from its UMD bundle (exposes a global `Diff2Html`).
// NOTE: the jsDelivr `/+esm` build is NOT used — its ESM transform mishandles
// diff2html's hogan.js template dependency and throws at import time
// ("n.Template is not a constructor"). The UMD bundle is the reliable browser path.
const DIFF2HTML_JS = 'https://cdn.jsdelivr.net/npm/diff2html@3.4.51/bundles/js/diff2html.min.js';
const DIFF2HTML_CSS = 'https://cdn.jsdelivr.net/npm/diff2html@3.4.51/bundles/css/diff2html.min.css';

// Inject diff2html's stylesheet once.
(function injectDiff2HtmlCss() {
  if (document.getElementById('diff2html-css')) return;
  const link = document.createElement('link');
  link.id = 'diff2html-css';
  link.rel = 'stylesheet';
  link.href = DIFF2HTML_CSS;
  document.head.appendChild(link);
})();

// Lazily load the UMD bundle; resolves once window.Diff2Html.html is available.
let _diff2htmlReady = null;
function diff2htmlReady() {
  if (window.Diff2Html && typeof window.Diff2Html.html === 'function') return Promise.resolve();
  if (_diff2htmlReady) return _diff2htmlReady;
  _diff2htmlReady = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = DIFF2HTML_JS;
    s.onload = () => {
      if (window.Diff2Html && typeof window.Diff2Html.html === 'function') resolve();
      else reject(new Error('diff2html loaded but global missing'));
    };
    s.onerror = () => reject(new Error('diff2html script failed to load'));
    document.head.appendChild(s);
  });
  return _diff2htmlReady;
}

let renderCounter = 0;

// Side-by-side only (per design): no view toggle.
function renderHtml(source) {
  return window.Diff2Html.html(source, {
    drawFileList: false,
    matching: 'lines',
    outputFormat: 'side-by-side',
  });
}

function wireCopy(scope, source) {
  const copyBtn = scope.querySelector('.diff-copy-source');
  if (!copyBtn) return;
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(source);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = source;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    const icon = copyBtn.querySelector('.material-symbols-outlined');
    icon.textContent = 'check';
    setTimeout(() => { icon.textContent = 'content_copy'; }, 2000);
  });
}

// Fullscreen overlay for reviewing a diff with more space.
function openMaximized(source) {
  const existing = document.querySelector('.diff-visualizer-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'diff-visualizer-overlay';
  overlay.innerHTML = `
    <div class="diff-visualizer-overlay-bar">
      <span class="diff-visualizer-label">Diff</span>
      <div class="diff-visualizer-actions">
        <button class="diff-copy-source" title="Copy raw diff"><span class="material-symbols-outlined">content_copy</span></button>
        <button class="diff-overlay-close" title="Close (Esc)"><span class="material-symbols-outlined">close</span></button>
      </div>
    </div>
    <div class="diff-visualizer-overlay-body">
      <div class="diff-visualizer-rendered">${renderHtml(source)}</div>
    </div>
  `;
  document.body.appendChild(overlay);
  wireCopy(overlay, source);

  function close() {
    overlay.remove();
    window.removeEventListener('keydown', esc);
  }
  function esc(e) { if (e.key === 'Escape') close(); }
  overlay.querySelector('.diff-overlay-close').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  window.addEventListener('keydown', esc);

  requestAnimationFrame(() => overlay.classList.add('active'));
}

async function renderDiffBlock(codeEl) {
  // Mark processed immediately to avoid re-entry from the observer.
  codeEl.setAttribute('data-diff-processed', 'true');

  const source = codeEl.textContent.replace(/\s+$/, '');
  if (!source) return;

  // CDN load failed (air-gapped / strict CSP) → leave the raw block readable.
  try {
    await diff2htmlReady();
  } catch {
    codeEl.removeAttribute('data-diff-processed');
    return;
  }

  renderCounter++;

  // Walk up to the outermost wrapper messages.js creates:
  // code -> pre -> .code-block-wrapper -> .markdown-block-wrap
  const pre = codeEl.parentElement;
  const blockWrapper = pre.closest('.markdown-block-wrap')
    || pre.closest('.code-block-wrapper')
    || pre;

  const container = document.createElement('div');
  container.className = 'diff-visualizer-container';

  let rendered;
  try {
    rendered = renderHtml(source);
  } catch {
    rendered = '';
  }

  // Empty/failed render → leave the original block untouched (still readable).
  if (!rendered || !rendered.includes('d2h-wrapper')) {
    codeEl.removeAttribute('data-diff-processed');
    return;
  }

  container.innerHTML = `
    <div class="diff-visualizer-toolbar">
      <span class="diff-visualizer-label">Diff</span>
      <div class="diff-visualizer-actions">
        <button class="diff-maximize" title="Maximize"><span class="material-symbols-outlined">open_in_full</span></button>
        <button class="diff-copy-source" title="Copy raw diff"><span class="material-symbols-outlined">content_copy</span></button>
      </div>
    </div>
    <div class="diff-visualizer-rendered">${rendered}</div>
  `;

  wireCopy(container, source);
  container.querySelector('.diff-maximize').addEventListener('click', () => openMaximized(source));

  blockWrapper.replaceWith(container);
}

function processDiffBlocks(root = document) {
  const blocks = root.querySelectorAll(
    'pre > code.language-diff:not([data-diff-processed])'
  );
  blocks.forEach(renderDiffBlock);
}

let debounceTimer = null;
function debouncedProcess() {
  if (debounceTimer) clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => processDiffBlocks(), 150);
}

const observer = new MutationObserver((mutations) => {
  let hasNew = false;
  for (const mutation of mutations) {
    for (const node of mutation.addedNodes) {
      if (node.nodeType !== Node.ELEMENT_NODE) continue;
      if (node.querySelector && node.querySelector('code.language-diff:not([data-diff-processed])')) {
        hasNew = true; break;
      }
      if (node.classList && node.classList.contains('language-diff') && !node.dataset.diffProcessed) {
        hasNew = true; break;
      }
    }
    if (hasNew) break;
  }
  if (hasNew) debouncedProcess();
});

observer.observe(document.body, { childList: true, subtree: true });
processDiffBlocks();
</script>

<style>
/* ── Container + toolbar (theme-aware: inherits A0's resolved --color-* vars,
      with fallbacks so it still renders standalone / in any theme) ── */
.diff-visualizer-container {
  position: relative;
  margin: 8px 0;
  border-radius: 8px;
  background: var(--color-panel, rgba(255, 255, 255, 0.03));
  border: 1px solid var(--color-border, rgba(255, 255, 255, 0.12));
  overflow: hidden;
}

.diff-visualizer-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  background: var(--color-message-bg, rgba(0, 0, 0, 0.2));
  border-bottom: 1px solid var(--color-border, rgba(255, 255, 255, 0.12));
}

.diff-visualizer-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--color-text-muted, rgba(255, 255, 255, 0.5));
}

.diff-visualizer-actions { display: inline-flex; gap: 4px; }

.diff-maximize,
.diff-copy-source,
.diff-overlay-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 1px solid var(--color-border, rgba(255, 255, 255, 0.15));
  background: transparent;
  cursor: pointer;
  color: var(--color-text, rgba(255, 255, 255, 0.7));
  padding: 0;
  overflow: hidden; /* clip the icon glyph so a missing-font fallback can't overflow onto siblings */
  transition: all 0.2s ease;
}

.diff-maximize:hover,
.diff-copy-source:hover,
.diff-overlay-close:hover { border-color: var(--color-primary, #89b4fa); }

.diff-maximize .material-symbols-outlined,
.diff-copy-source .material-symbols-outlined,
.diff-overlay-close .material-symbols-outlined { font-size: 16px; }

.diff-visualizer-rendered {
  overflow-x: auto;
  font-size: 12px;
  color: var(--color-text, #cdd6f4);
}

/* ── Theme-aware diff2html overrides: keep ALL text legible on any theme, and
      use translucent green/red so add/remove tints work over light or dark ── */
.diff-visualizer-rendered .d2h-wrapper { background: transparent; }
.diff-visualizer-rendered .d2h-tag { display: none; } /* hide CHANGED/ADDED/etc. file-header labels */
.diff-visualizer-rendered .d2h-file-header {
  background: var(--color-message-bg, rgba(255, 255, 255, 0.04));
  border-color: var(--color-border, rgba(255, 255, 255, 0.12));
}
.diff-visualizer-rendered .d2h-file-name { color: var(--color-text, #cdd6f4); }
.diff-visualizer-rendered .d2h-diff-table { background: transparent; }
.diff-visualizer-rendered .d2h-code-line,
.diff-visualizer-rendered .d2h-code-side-line,
.diff-visualizer-rendered .d2h-code-line-ctn { color: var(--color-text, #cdd6f4); }
.diff-visualizer-rendered .d2h-code-linenumber,
.diff-visualizer-rendered .d2h-code-side-linenumber {
  color: var(--color-text-muted, rgba(255, 255, 255, 0.5));
  background: var(--color-panel, transparent);
  border-color: var(--color-border, rgba(255, 255, 255, 0.12));
}
.diff-visualizer-rendered .d2h-info {
  background: var(--color-message-bg, rgba(255, 255, 255, 0.04));
  color: var(--color-text-muted, rgba(255, 255, 255, 0.5));
}
.diff-visualizer-rendered .d2h-cntx { background: transparent; }
.diff-visualizer-rendered .d2h-ins { background: rgba(46, 160, 67, 0.15); }
.diff-visualizer-rendered .d2h-del { background: rgba(248, 81, 73, 0.15); }
.diff-visualizer-rendered .d2h-code-line ins,
.diff-visualizer-rendered .d2h-code-side-line ins {
  background: rgba(46, 160, 67, 0.4); text-decoration: none;
}
.diff-visualizer-rendered .d2h-code-line del,
.diff-visualizer-rendered .d2h-code-side-line del {
  background: rgba(248, 81, 73, 0.4); text-decoration: none;
}
.diff-visualizer-rendered .d2h-emptyplaceholder,
.diff-visualizer-rendered .d2h-code-side-emptyplaceholder {
  background: var(--color-panel, transparent);
  border-color: var(--color-border, rgba(255, 255, 255, 0.12));
}

/* ── Maximize overlay ── */
.diff-visualizer-overlay {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  background: var(--color-chat-background, #1e1e2e);
  opacity: 0;
  transition: opacity 0.2s ease;
}
.diff-visualizer-overlay.active { opacity: 1; }

.diff-visualizer-overlay-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 16px;
  background: var(--color-panel, rgba(30, 30, 46, 0.95));
  border-bottom: 1px solid var(--color-border, rgba(255, 255, 255, 0.12));
  flex-shrink: 0;
}

.diff-visualizer-overlay-body {
  flex: 1;
  overflow: auto;
  padding: 16px;
}
.diff-visualizer-overlay-body .diff-visualizer-rendered { font-size: 13px; }
</style>
</body>
</html>
