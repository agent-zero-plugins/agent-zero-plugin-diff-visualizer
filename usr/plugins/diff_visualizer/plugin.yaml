title: "DiffVisualizer"
name: diff_visualizer
version: "0.1.3"
description: |
  Renders unified-diff fenced code blocks as side-by-side visual diffs in the
  chat UI, with a maximize view for reviewing large diffs. Includes a skill that
  teaches the agent to emit valid unified diffs and a behavioral nudge that
  encourages diff rendering for proposed changes and before/after views.

author: "Omar Nahhas"
license: Apache-2.0
homepage: https://github.com/agent-zero-plugins/agent-zero-plugin-diff-visualizer
per_project_config: false
per_agent_config: false
always_enabled: false
